name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # Listen's voice files (pinned by sha256) come from Hugging Face, GitHub and PyPI on a cold cache.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/tts/src
          key: tts-${{ hashFiles('scripts/build-tts.ts') }}
      # The build regenerates committed files (kit exports, splash demos); they must match.
      - run: bun run build
      - name: Generated files are committed and current
        run: test -z "$(git status --porcelain -- src/worker)" || { git status --porcelain -- src/worker; git diff -- src/worker; exit 1; }
